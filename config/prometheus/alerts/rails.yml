groups:
  - name: rails-alerts
    rules:
      - alert: HighErrorRate
        expr: |
          sum(rate(rails_requests_total{status=~"5.."}[5m])) by (environment)
          / sum(rate(rails_requests_total[5m])) by (environment) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High 5xx error rate in {{ $labels.environment }}"
          description: "Error rate is {{ $value | humanizePercentage }}"

      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(rails_request_duration_seconds_bucket[5m])) by (le, environment)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency in {{ $labels.environment }}"
          description: "p95 latency is {{ $value }}s"

      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.job }} instance {{ $labels.instance }} has been down for more than 1 minute"

      - alert: DatabaseConnectionPoolExhausted
        expr: activerecord_connection_pool_waiting > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool exhausted in {{ $labels.environment }}"
          description: "{{ $value }} threads waiting for database connections"

      - alert: HighDatabaseConnectionUsage
        expr: |
          100 * activerecord_connection_pool_connections / activerecord_connection_pool_size > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DB connection pool usage in {{ $labels.environment }}"
          description: "Connection pool usage is {{ $value | humanize }}%"

      - alert: PumaThreadsExhausted
        expr: |
          100 * sum(puma_busy_threads) by (environment) / sum(puma_max_threads) by (environment) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Puma threads nearly exhausted in {{ $labels.environment }}"
          description: "Thread utilization is {{ $value | humanize }}%"
