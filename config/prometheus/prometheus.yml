global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # RestaurantOps Production - Web servers
  - job_name: 'restaurantops-web'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - '64.23.192.251'
          - '64.23.182.234'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'web'

  # Node Exporter - Server metrics (CPU, RAM, disk, etc.)
  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '64.23.192.251:9100'
          - '64.23.182.234:9100'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'web'

  # RestaurantOps Production - Job servers (Sidekiq)
  - job_name: 'restaurantops-job'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - '143.110.154.221'
          - '64.23.140.194'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'job'
      - targets:
          - '143.198.149.49'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'job-critical'
