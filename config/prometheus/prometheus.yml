global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # RestaurantOps Production - Web servers
  - job_name: 'restaurantops-web'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    scheme: http
    static_configs:
      - targets:
          - '64.23.192.251'
          - '64.23.182.234'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'web'
    # Drop histogram buckets no dashboard or alert uses: about half of all series
    # on a 1GB droplet. _sum and _count are kept, so averages still work.
    # rails_request_duration_seconds_bucket is used (latency panels, slow-request alert).
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'rails_db_runtime_seconds_bucket|rails_view_runtime_seconds_bucket|activerecord_query_duration_seconds_bucket'
        action: drop

  # Sidekiq - queue size and latency, processed/failed, retry and dead sets.
  # The values are cluster-wide (read from Redis), so one target covers both job servers.
  - job_name: 'restaurantops-sidekiq'
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets:
          - 'clover-monitoring-sidekiq-exporter:9292'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'job'

  # Node Exporter - Server metrics (CPU, RAM, disk, etc.)
  - job_name: 'node-exporter'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - '64.23.192.251:9100'
          - '64.23.182.234:9100'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'web'
      - targets:
          - '64.23.140.194:9100'
          - '143.110.154.221:9100'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'job'
      - targets:
          - 'clover-monitoring-node-exporter:9100'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'monitoring'

  # Load balancers - TCP connect to each LB IP via blackbox_exporter
  - job_name: 'blackbox-lb-tcp'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ['64.225.88.153:443']
        labels:
          lb: 'orders-load-balancer'
          host: 'orders.restaurantops.co'
      - targets: ['143.244.211.166:443']
        labels:
          lb: 'menugram-sfo3-load-balancer-01'
          host: 'orders.menugram.app'
      - targets: ['24.199.69.51:443']
        labels:
          lb: 'myrest-load-balancer'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: clover-monitoring-blackbox-exporter:9115

  # Health endpoints - full HTTPS request through DNS and the load balancer
  - job_name: 'blackbox-http'
    scrape_interval: 15s
    scrape_timeout: 12s
    metrics_path: /probe
    params:
      module: [http_up]
    static_configs:
      - targets:
          - 'https://orders.restaurantops.co/up'
          - 'https://orders.menugram.app/up'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: clover-monitoring-blackbox-exporter:9115

  # PostgreSQL - Database metrics via postgres_exporter
  # postgres_exporter should be running with:
  # DATA_SOURCE_NAME="postgresql://prometheus_exporter:YOUR_PASSWORD_HERE@your-db-host:25060/defaultdb?sslmode=require"
  - job_name: 'postgres'
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'clover-monitoring-postgres-exporter:9187'
        labels:
          app: 'restaurantops'
          environment: 'production'
          role: 'database'
