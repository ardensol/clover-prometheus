# Kamal 2 configuration for Prometheus + Grafana monitoring stack
# Grafana = main service (user-facing UI with SSL)
# Prometheus = accessory (internal only, no public URL needed)

service: clover-monitoring

image: restaurantops/grafana

# Applies to the accessories too. The droplet's disk is 24GB.
logging:
  driver: json-file
  options:
    max-size: 100m
    max-file: 3

ssh:
  user: root

builder:
  arch: amd64

# Grafana as main service (gets SSL via Kamal proxy)
servers:
  web:
    hosts:
      - 161.35.237.161  # Replace with your DigitalOcean IP

# Kamal 2 proxy config - SSL for Grafana
proxy:
  ssl: true
  hosts:
    - grafana.restaurantops.co
  app_port: 3000
  healthcheck:
    path: /api/health
    interval: 10
    timeout: 30

# Prometheus as accessory (internal only, no public URL)
accessories:
  prometheus:
    image: prom/prometheus:v3.13.5
    host: 161.35.237.161  # Replace with your DigitalOcean IP
    port: 9090:9090
    directories:
      - prometheus_data:/prometheus
    files:
      - config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    # Kamal runs accessories with --restart unless-stopped, so an OOM kill restarts it.
    # The memory cap keeps an OOM inside this container instead of hanging the
    # 1GB droplet (Nov 18: the whole box stalled for 36 minutes). Prometheus 3
    # sets GOMEMLIMIT to 90% of the cap, so it collects garbage harder before
    # it gets there. The healthcheck shows "unhealthy" in docker ps; Docker
    # does not restart on it.
    options:
      user: root
      memory: 512m
      memory-swap: 768m
      health-cmd: wget -q --spider http://localhost:9090/-/healthy
      health-interval: 30s
      health-timeout: 5s
      health-retries: 3
    # max-samples and max-concurrency bound query memory, so a wide dashboard
    # range can't take Prometheus past its cap. The defaults are 50M and 20.
    cmd: >-
      --config.file=/etc/prometheus/prometheus.yml
      --storage.tsdb.path=/prometheus
      --storage.tsdb.retention.time=30d
      --storage.tsdb.retention.size=15GB
      --query.max-samples=5000000
      --query.max-concurrency=4
      --web.enable-lifecycle

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    host: 161.35.237.161
    port: 9187:9187
    env:
      secret:
        - DATA_SOURCE_NAME

  # Probes the load balancers and health endpoints. No published port:
  # Prometheus reaches it on the kamal network as clover-monitoring-blackbox-exporter:9115
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    host: 161.35.237.161
    files:
      - config/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml

  # Server metrics for this monitoring droplet. No published port: Prometheus
  # reaches it as clover-monitoring-node-exporter:9100. The host's root is
  # mounted read-only so disk usage is the droplet's, not the container's.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    host: 161.35.237.161
    options:
      pid: host
    volumes:
      - /:/host:ro,rslave
    cmd: --path.rootfs=/host

  # Sidekiq queue metrics, read from the app's Sidekiq Redis. No published port:
  # Prometheus reaches it as clover-monitoring-sidekiq-exporter:9292, so the job
  # servers publish nothing. Redis must allow connections from this droplet.
  sidekiq-exporter:
    image: strech/sidekiq-prometheus-exporter:0.4.0
    host: 161.35.237.161
    env:
      secret:
        - REDIS_URL:REDIS_SIDEKIQ_URL

# Docker registry
registry:
  username: restaurantops
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables for Grafana
env:
  clear:
    GF_SECURITY_ADMIN_USER: admin
    GF_USERS_ALLOW_SIGN_UP: "false"
    GF_SERVER_ROOT_URL: https://grafana.restaurantops.co
    # Point Grafana to Prometheus accessory container
    GF_DATASOURCES_DEFAULT_URL: http://clover-monitoring-prometheus:9090
  secret:
    - GRAFANA_ADMIN_PASSWORD
    # Incoming webhook for the Slack contact point. Channel is the webhook's channel.
    # Alert notifications (config/grafana/provisioning/alerting/notifications.yaml)
    - SLACK_WEBHOOK_URL

# Volume mounts for Grafana data persistence
volumes:
  - grafana_data:/var/lib/grafana
