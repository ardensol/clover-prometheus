# Default notification policy. One tree for org 1; this file replaces whatever
# was set in the UI (the built-in email receiver). Every alert, including
# critical and warning, goes to the Slack contact point.

apiVersion: 1

policies:
  - orgId: 1
    receiver: Slack
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
