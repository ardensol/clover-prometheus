# Grafana Alerting Provisioning
# These alerts are managed by Grafana, not Prometheus/Mimir/Cortex

apiVersion: 1

groups:
  - orgId: 1
    name: Rails Alerts
    folder: Rails
    interval: 1m
    rules:
      # Counts, not a ratio: traffic is low and 5xx are rare (a few a week), so a
      # percentage is noisy at night and diluted by busy endpoints during the day.
      # Counting pattern used by every count-based rule here:
      #   increase(x[W])  misses the first increment of a series that starts
      #   inside the window (a rare error's first occurrence, or the first after
      #   a deploy), so add the starting value of series absent W ago:
      #   min_over_time(x[W]) unless x offset W
      - uid: high-error-rate
        title: ServerErrors
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (sum(increase(rails_requests_total{status=~"5.."}[15m])) or vector(0))
                + (sum(min_over_time(rails_requests_total{status=~"5.."}[15m])
                    unless rails_requests_total{status=~"5.."} offset 15m) or vector(0))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2.5
                  operator:
                    type: and
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rails server errors"
          description: "3 or more 5xx responses in the last 15 minutes (normal is a few per week)"
        noDataState: NoData
        execErrState: Error

      - uid: high-latency
        title: HighLatency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(rails_request_duration_seconds_bucket[5m])) by (le, environment))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency"
          description: "p95 latency is above 2 seconds"
        noDataState: NoData
        execErrState: Error

      - uid: instance-down
        title: InstanceDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance is down"
          description: "An instance has been down for more than 1 minute"
        noDataState: NoData
        execErrState: Error

      - uid: db-pool-exhausted
        title: DatabaseConnectionPoolExhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: activerecord_connection_pool_waiting
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
                  operator:
                    type: and
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "DB connection pool exhausted"
          description: "Threads are waiting for database connections"
        noDataState: NoData
        execErrState: Error

      - uid: high-db-connection-usage
        title: HighDatabaseConnectionUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * activerecord_connection_pool_connections / activerecord_connection_pool_size
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High DB connection pool usage"
          description: "Connection pool usage is above 80%"
        noDataState: NoData
        execErrState: Error

      - uid: puma-threads-exhausted
        title: PumaThreadsExhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (sum by (instance) (puma_max_threads) - sum by (instance) (puma_pool_capacity)) / sum by (instance) (puma_max_threads)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Puma threads nearly exhausted"
          description: "Thread utilization is above 90%"
        noDataState: NoData
        execErrState: Error

  - orgId: 1
    name: System Alerts
    folder: System
    interval: 1m
    rules:
      - uid: high-cpu-usage
        title: HighCPUUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 85%"
        noDataState: NoData
        execErrState: Error

      - uid: critical-cpu-usage
        title: CriticalCPUUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 95
                  operator:
                    type: and
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical CPU usage"
          description: "CPU usage is above 95%"
        noDataState: NoData
        execErrState: Error

      - uid: high-memory-usage
        title: HighMemoryUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 85%"
        noDataState: NoData
        execErrState: Error

      - uid: critical-memory-usage
        title: CriticalMemoryUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 95
                  operator:
                    type: and
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Critical memory usage"
          description: "Memory usage is above 95%"
        noDataState: NoData
        execErrState: Error

      - uid: high-disk-usage
        title: HighDiskUsage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High disk usage"
          description: "Disk usage is above 80%"
        noDataState: NoData
        execErrState: Error

  - orgId: 1
    name: PostgreSQL Alerts
    folder: PostgreSQL
    interval: 1m
    rules:
      - uid: postgres-down
        title: PostgresDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: pg_up
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
                  operator:
                    type: and
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL is down"
          description: "PostgreSQL database is not responding"
        noDataState: NoData
        execErrState: Error

      - uid: postgres-high-connections
        title: PostgresHighConnections
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 100 * sum(pg_stat_activity_count) / sum(pg_settings_max_connections)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PostgreSQL connection usage"
          description: "Connection usage is above 80%"
        noDataState: NoData
        execErrState: Error

      - uid: postgres-slow-queries
        title: PostgresSlowQueries
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(pg_stat_activity_count{state="active"})
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High number of active queries"
          description: "More than 10 active queries running"
        noDataState: NoData
        execErrState: Error

  - orgId: 1
    name: Load Balancer Alerts
    folder: Load Balancers
    interval: 1m
    rules:
      - uid: lb-connect-failures
        title: LoadBalancerConnectFailures
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: '1 - avg_over_time(probe_success{job="blackbox-lb-tcp"}[15m])'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.05
                  operator:
                    type: and
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Load balancer dropping connections"
          description: "More than 5% of TCP connects to {{ $labels.lb }} ({{ $labels.instance }}) failed over the last 15 minutes"
        noDataState: NoData
        execErrState: Error

      - uid: lb-slow-connect
        title: LoadBalancerSlowConnect
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'quantile_over_time(0.5, probe_duration_seconds{job="blackbox-lb-tcp"}[15m])'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Load balancer connects are slow"
          description: "Median TCP connect time to {{ $labels.lb }} ({{ $labels.instance }}) is above 500ms"
        noDataState: NoData
        execErrState: Error

      - uid: health-endpoint-down
        title: HealthEndpointDown
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'avg_over_time(probe_success{job="blackbox-http"}[5m])'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0.5
                  operator:
                    type: and
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Health endpoint failing"
          description: "Most requests to {{ $labels.instance }} failed over the last 5 minutes"
        noDataState: NoData
        execErrState: Error

      - uid: tls-cert-expiring
        title: TLSCertificateExpiring
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: '(probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time()) / 86400'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 14
                  operator:
                    type: and
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expiring soon"
          description: "The certificate for {{ $labels.instance }} expires in under 14 days. Let's Encrypt renewal on the load balancer may have failed."
        noDataState: NoData
        execErrState: Error

  - orgId: 1
    name: Checkout Alerts
    folder: Checkout
    interval: 1m
    rules:
      - uid: checkout-server-error
        title: CheckoutServerError
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                ((sum(increase(rails_requests_total{status=~"5..",controller=~"restaurants/order|restaurants/checkout|restaurants/line_items|api/v1/orders|api/v1/orders/line_items"}[15m])) or vector(0))
                + (sum(min_over_time(rails_requests_total{status=~"5..",controller=~"restaurants/order|restaurants/checkout|restaurants/line_items|api/v1/orders|api/v1/orders/line_items"}[15m]) unless rails_requests_total{status=~"5..",controller=~"restaurants/order|restaurants/checkout|restaurants/line_items|api/v1/orders|api/v1/orders/line_items"} offset 15m) or vector(0)))
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "Server error in checkout"
          description: "A 5xx response from cart, checkout, pay or the orders API in the last 15 minutes. Customers may be unable to order."
        noDataState: NoData
        execErrState: Error
      
      # pay returns 422 for declines and validation errors about 2 in 3 times, so
      # a rejection ratio is normal noise. An outage shows as attempts with no success.
      - uid: checkout-payments-failing
        title: CheckoutPaymentsFailing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                (((sum(increase(rails_requests_total{controller="restaurants/order",action="pay"}[60m])) or vector(0))
                + (sum(min_over_time(rails_requests_total{controller="restaurants/order",action="pay"}[60m]) unless rails_requests_total{controller="restaurants/order",action="pay"} offset 60m) or vector(0))) >= bool 20)
                * (((sum(increase(rails_requests_total{controller="restaurants/order",action="pay",status="302"}[60m])) or vector(0))
                + (sum(min_over_time(rails_requests_total{controller="restaurants/order",action="pay",status="302"}[60m]) unless rails_requests_total{controller="restaurants/order",action="pay",status="302"} offset 60m) or vector(0))) < bool 0.5)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "No successful payments"
          description: "20 or more pay attempts and no successful payment in the last hour. A payment processor or POS may be down."
        noDataState: NoData
        execErrState: Error
      
  # Sidekiq metrics come from the sidekiq-exporter accessory, which reads Redis.
  # If it can't reach Redis its scrape fails and InstanceDown fires instead.
  # Latency is how long the oldest job in a queue has waited. An empty queue reports 0.
  - orgId: 1
    name: Sidekiq Alerts
    folder: Sidekiq
    interval: 1m
    rules:
      - uid: sidekiq-critical-latency
        title: SidekiqCriticalQueueLatency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(sidekiq_queue_latency_seconds{name="critical"}) or vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 60
                  operator:
                    type: and
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Sidekiq critical queue is backed up"
          description: "The oldest job in the critical queue has waited over 60 seconds for 5 minutes. Order processing may be stuck."
        noDataState: NoData
        execErrState: Error

      - uid: sidekiq-default-latency
        title: SidekiqDefaultQueueLatency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(sidekiq_queue_latency_seconds{name="default"}) or vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
                  operator:
                    type: and
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sidekiq default queue is backed up"
          description: "The oldest job in the default queue has waited over 5 minutes, for 5 minutes."
        noDataState: NoData
        execErrState: Error

      # A job lands in the dead set after it uses up its retries. Compares against
      # an hour ago, so it keeps firing for an hour after a job dies.
      - uid: sidekiq-dead-set-growing
        title: SidekiqDeadSetGrowing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (max(sidekiq_dead_jobs) - max(sidekiq_dead_jobs offset 1h)) or vector(0)
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              refId: B
              expression: A
              reducer: last
          - refId: C
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              refId: C
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0.5
                  operator:
                    type: and
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sidekiq dead set is growing"
          description: "One or more jobs moved to the Sidekiq dead set in the last hour after using up their retries. Check /sidekiq/morgue."
        noDataState: NoData
        execErrState: Error

# Rules removed from this file must be listed here, or Grafana keeps them
deleteRules:
  - orgId: 1
    uid: postgres-replication-lag
